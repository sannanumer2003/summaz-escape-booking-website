<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summaz Escape — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Urbanist', system-ui, sans-serif;
      background: #fff;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    .logo { width: 140px; height: auto; margin: 0 auto 20px; display: block; }

    .brand { font-size: 28px; font-weight: 900; letter-spacing: -.03em; color: #031D2F; margin-bottom: 8px; }
    .tagline { font-size: 15px; color: #9CA3AF; font-weight: 400; margin-bottom: 64px; }

    .countdown {
      display: flex;
      gap: 32px;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 72px;
    }
    .countdown__unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .countdown__num {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -.04em;
      color: #031D2F;
      line-height: 1;
      min-width: 80px;
    }
    .countdown__label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #9CA3AF;
    }
    .countdown__sep {
      font-size: 52px;
      font-weight: 300;
      color: #D1D5DB;
      line-height: 1;
      padding-bottom: 14px;
    }

    .access-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Urbanist', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #031D2F;
      text-decoration: none;
      border: 2px solid #031D2F;
      border-radius: 999px;
      padding: 14px 30px;
      transition: background .15s, color .15s;
      letter-spacing: -.01em;
    }
    .access-btn:hover { background: #031D2F; color: #fff; text-decoration: none; }
    .access-btn svg { flex-shrink: 0; }

    .footer-note { position: fixed; bottom: 24px; font-size: 12px; color: #D1D5DB; }

    @media (max-width: 480px) {
      .logo { width: 110px; }
      .brand { font-size: 22px; }
      .countdown { gap: 16px; }
      .countdown__num { font-size: 44px; min-width: 56px; }
      .countdown__sep { font-size: 36px; padding-bottom: 10px; }
    }
  </style>
</head>
<body>

  <img src="https://res.cloudinary.com/dko76z0df/image/upload/v1782304824/summaz/logo.png" class="logo" alt="Summaz Escape">
  <p class="brand">Summaz Escape</p>
  <p class="tagline">Nassau, Bahamas &nbsp;·&nbsp; Arawak Cay</p>

  <div class="countdown">
    <div class="countdown__unit">
      <span class="countdown__num" id="cDays">00</span>
      <span class="countdown__label">Days</span>
    </div>
    <span class="countdown__sep">:</span>
    <div class="countdown__unit">
      <span class="countdown__num" id="cHours">00</span>
      <span class="countdown__label">Hours</span>
    </div>
    <span class="countdown__sep">:</span>
    <div class="countdown__unit">
      <span class="countdown__num" id="cMins">00</span>
      <span class="countdown__label">Min</span>
    </div>
    <span class="countdown__sep">:</span>
    <div class="countdown__unit">
      <span class="countdown__num" id="cSecs">00</span>
      <span class="countdown__label">Sec</span>
    </div>
  </div>

  <a href="access.html" class="access-btn">
    Open with private access
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8h10M9 4l4 4-4 4"/>
    </svg>
  </a>

  <p class="footer-note">&copy; 2026 Summaz Escape</p>

  <script>
    // Set your launch date/time here (Nassau = EST, UTC-5)
    var LAUNCH = new Date('2026-06-26T12:00:00-05:00');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var diff = LAUNCH - Date.now();
      if (diff <= 0) {
        document.getElementById('cDays').textContent  = '00';
        document.getElementById('cHours').textContent = '00';
        document.getElementById('cMins').textContent  = '00';
        document.getElementById('cSecs').textContent  = '00';
        return;
      }
      var s = Math.floor(diff / 1000);
      var m = Math.floor(s / 60);  s %= 60;
      var h = Math.floor(m / 60);  m %= 60;
      var d = Math.floor(h / 24);  h %= 24;
      document.getElementById('cDays').textContent  = pad(d);
      document.getElementById('cHours').textContent = pad(h);
      document.getElementById('cMins').textContent  = pad(m);
      document.getElementById('cSecs').textContent  = pad(s);
    }

    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>
