<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://res.cloudinary.com/dko76z0df/image/upload/v1782304824/summaz/logo.png">
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dko76z0df/image/upload/v1782304824/summaz/logo.png">
  <title>Private Access — Summaz Escape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Urbanist', system-ui, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo { width: 90px; height: auto; margin: 0 auto 16px; display: block; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: #031D2F; margin-bottom: 32px; }

    .form { display: flex; flex-direction: column; gap: 12px; text-align: left; }

    label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6B7280; display: block; margin-bottom: 5px; }

    input {
      width: 100%;
      padding: 13px 14px;
      font-family: 'Urbanist', system-ui, sans-serif;
      font-size: 15px;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      outline: none;
      color: #111827;
      background: #fff;
      transition: border-color .15s;
    }
    input:focus { border-color: #01A9CE; }

    .error {
      font-size: 13px;
      color: #EF4444;
      text-align: center;
      min-height: 18px;
      margin-top: 2px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #031D2F;
      color: #fff;
      font-family: 'Urbanist', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
      transition: background .15s;
      letter-spacing: -.01em;
    }
    .submit-btn:hover { background: #052d47; }

    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #9CA3AF; text-decoration: none; }
    .back:hover { color: #374151; }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://res.cloudinary.com/dko76z0df/image/upload/v1782304824/summaz/logo.png" class="logo" alt="Summaz Escape">
    <p class="brand">Summaz Escape</p>

    <form class="form" id="accessForm" autocomplete="off" onsubmit="return false;">
      <div>
        <label for="username">Username</label>
        <input type="email" id="username" placeholder="Enter username" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">
      </div>
      <p class="error" id="errMsg"></p>
      <button type="submit" class="submit-btn" id="enterBtn" onclick="tryAccess()">Enter</button>
    </form>

    <a href="coming-soon.html" class="back">← Back</a>
  </div>

  <script>
    function tryAccess() {
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var err = document.getElementById('errMsg');

      if (u === 'booking@summazescape.com' && p === 'Booking@SummazEscape&&00') {
        sessionStorage.setItem('summaz_access', '1');
        window.location.href = 'index.html';
      } else {
        err.textContent = 'Incorrect username or password.';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') tryAccess();
    });
  </script>

</body>
</html>
